<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Convite para Mayara ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ff758c,#ff7eb3);overflow:hidden}
.card{width:min(92%,430px);background:#fff;padding:38px 24px;border-radius:28px;text-align:center;box-shadow:0 20px 60px #0003}
.heart{font-size:58px;animation:pulse 1s infinite}h1{color:#e91e63;margin:10px 0;font-size:30px}p{color:#555;font-size:18px;line-height:1.5}
.buttons{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:28px;min-height:65px}
button{border:0;border-radius:50px;padding:15px 27px;font-size:18px;font-weight:bold;cursor:pointer}
#yes{background:#e91e63;color:#fff}#no{background:#eee;color:#555;position:relative}
#msg{display:none;margin-top:22px;font-size:22px;color:#e91e63;font-weight:bold}
.small{font-size:13px;color:#999;margin-top:18px}
#musicBtn{
position:fixed;top:18px;right:18px;z-index:10;
background:#e91e63;color:#fff;border:0;border-radius:50px;
padding:11px 16px;font-size:14px;font-weight:bold;
box-shadow:0 6px 18px #0003;
}
@keyframes pulse{50%{transform:scale(1.15)}} 
</style>
</head>
<body>
<audio id="musica" loop preload="auto">
  <source src="musica.mp3" type="audio/mpeg">
</audio>
<button id="musicBtn" onclick="toggleMusica()" aria-label="Ativar música">🎵 Ativar música</button>
<div class="card">
<div class="heart">❤️</div>
<h1>Mayara, tenho uma pergunta...</h1>
<p>Você topa sair comigo? 😏</p>
<p><strong>Prometo que vai ser divertido!</strong><br>Agora escolha com cuidado... 😂</p>
<div class="buttons">
<button id="yes" onclick="sim()">SIM 😍</button>
<button id="no" onmouseover="fugir()" ontouchstart="fugir()">NÃO 🙈</button>
</div>
<div id="msg">EU SABIA! 😂❤️</div>
<div class="small">P.S.: O botão NÃO está meio indeciso... 🤭</div>
</div>
<script>
function toggleMusica(){
 const audio=document.getElementById("musica");
 const btn=document.getElementById("musicBtn");
 if(audio.paused){
   audio.play().then(()=>btn.textContent="🔇 Pausar música").catch(()=>{});
 }else{
   audio.pause();
   btn.textContent="🎵 Ativar música";
 }
}
function sim(){
 const numero="5511984342145";
 const mensagem="SIM! 😍❤️ Eu topo sair com você! Quando vamos?";
 window.location.href="https://wa.me/"+numero+"?text="+encodeURIComponent(mensagem);
}
function fugir(){
 const no=document.getElementById("no");
 const x=(Math.random()*240)-120, y=(Math.random()*130)-65;
 no.style.transform=`translate(${x}px,${y}px)`;
}
</script>
</body>
</html>
